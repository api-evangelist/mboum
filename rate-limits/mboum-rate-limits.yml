name: Mboum Stock & Options Data API
generated: '2026-09-21'
method: searched
source: https://docs.mboum.com/
note: >-
  Documented global rate limit of 15 requests per second; exceeding it returns HTTP 429
  Too Many Requests, and the docs recommend implementing a retry mechanism. Each endpoint
  additionally carries an "Endpoint weight" (most are weight 1) that consumes plan
  request quota accordingly. No RateLimit-* / Retry-After response headers are documented.
  Per-plan MONTHLY request quotas (from the pricing page) are recorded on each tier in
  plans/mboum-plans-pricing.yml: Investor 10,000; Business 50,000; Developer 250,000;
  Enterprise 2,500,000 requests per month.
limits:
- name: Global request rate
  limit_text: The current limit is set to 15 requests per second.
  window: second
  max: 15
  scope: per-account
  status_code: 429
