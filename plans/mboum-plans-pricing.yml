note: >-
  Four public monthly subscription tiers priced by monthly API request quota; every tier
  includes the full endpoint surface (stock, options, calendar, indicators, historical,
  financials, screeners, insider trades, real-time SEC filings) and commercial use.
  Annual billing is advertised as ~20% cheaper (the pricing page shows a reduced
  per-month-equivalent under the Yearly toggle). Custom / high-volume plans available on
  request via the contact form. Payment via credit card (Visa, MasterCard, Discover,
  American Express); enterprise customers may request annual bank transfer.
